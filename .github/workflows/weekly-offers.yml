name: Tägliche Angebotssuche

on:
  push:
    branches: [main]
    paths:
      - "scripts/update_offers.py"
      - ".github/workflows/weekly-offers.yml"
  schedule:
    - cron: "13 8 * * *"
      timezone: Europe/Berlin
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-offers
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Repository laden
        uses: actions/checkout@v6

      - name: Python einrichten
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Regionale Prospektangebote prüfen
        run: python scripts/update_offers.py

      - name: Geänderte Angebotsdaten veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add angebote.json
          if git diff --cached --quiet; then
            echo "Keine Änderung an angebote.json."
          else
            git commit -m "Tägliche Angebotsdaten aktualisieren"
            git pull --rebase origin main
            git push
          fi

      - name: GitHub Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Homepage-Dateien zusammenstellen
        run: |
          mkdir _site
          cp index.html app.js styles.css angebote.json _site/

      - name: Veröffentlichungsdateien hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Homepage veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4

